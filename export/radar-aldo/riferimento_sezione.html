.note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }

const px = v => v == null ? "–" : mig(v, Math.abs(v) >= 1000 ? 0 : Math.abs(v) >= 100 ? 1 : Math.abs(v) >= 1 ? 2 : 4);
const usd = v => v == null ? "–" : mig(v) + " $";
const pct = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + mig(v, d) + "%";
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const dt = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + " " + s.slice(11, 16) : "–";

function tabella(intest, righe, vuoto) {

}
const td = (v, c = "") => `<td class="${c}">${v}</td>`;

function sezione(s) {

  const stat = st.trader ? tabella(["", ...W.map(w => w[1])], righe.map(([k, f]) => [td(k, "l"), ...W.map(w => td(f(st[w[0]] || {})))]), "") : `<p class="niente">Nessuna operazione registrata.</p>`;

      ${r.prezzi_dichiarati ? `Ritardo fra il prezzo d'ingresso dichiarato e il messaggio: mediana ${mig(r.mediana_ore, 1)} ore, un quarto oltre ${mig(r.quartile_ore, 1)} ore.` : ""}</p>
